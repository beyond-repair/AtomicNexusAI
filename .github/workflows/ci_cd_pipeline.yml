# ci_cd_pipeline.yml
# Sweep-242: previous workflow pinned Python 3.8 and ran flake8 on the whole tree.
# pyproject requires Python >= 3.10. Orphan root trees are historical and are not the Claim-0 surface.
# This job installs the package and runs the maintained pytest suite only.
name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run Tests
        run: pytest -q
