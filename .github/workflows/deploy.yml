# deploy.yml
name: Deploy Atomic Nexus AI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Security Audit
        run: python -m security.audit.attack_simulator --strict-mode

      - name: Run Tests
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Deploy to Production
        # deploy.sh is mode 100644 in git. Direct execution failed run 37492591439
        # with exit 126. bash does not require the executable bit. The script only echoes.
        run: bash deploy.sh
